# kajisho5/runway の共通ワークフローで TestFlight に送る（Secrets は runway の sync-secrets が配る）
name: testflight

on:
  workflow_dispatch:      # GitHub の Actions タブ／iPhone の GitHub アプリから手動実行
  push:
    tags: ["v*"]          # v1.0.0 などのタグを push しても実行

permissions:
  contents: read

jobs:
  ios:
    uses: kajisho5/runway/.github/workflows/apple-testflight.yml@main
    with:
      bundle_id: com.seventhwell.GenbaTokei
      project: GenbaTokei.xcodeproj
      scheme: GenbaTokei
      # Apple Watch アプリを同梱
      extra_sdks: watchOS
      # .xcodeproj はコミットせず、project.yml から毎回つくる
      pre_build: brew install xcodegen && xcodegen generate
      xcode: "27.2"
      runner: xcode-27
    secrets: inherit
