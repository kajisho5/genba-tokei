name: TestFlight へ配布

# 手動で実行する（GitHub の Actions 画面 →「TestFlight へ配布」→「Run workflow」）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX }}
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: 設定の確認
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$BUNDLE_ID_PREFIX" ] || missing="$missing 変数BUNDLE_ID_PREFIX"
          [ -n "$DEVELOPMENT_TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::未設定:$missing"; exit 1; fi
      - uses: actions/checkout@v5
      - name: 準備（Xcode 選択・プロジェクト生成）
        run: ci/setup.sh
      - name: API キーを一時ファイルに書き出す
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: アーカイブ（署名つきビルド）
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project GenbaTokei.xcodeproj -scheme GenbaTokei -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/GenbaTokei.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} | tee build-archive.log | grep -E '(error|\*\* )' || true
          grep -q '\*\* ARCHIVE SUCCEEDED \*\*' build-archive.log
      - name: App Store Connect へアップロード
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          /usr/libexec/PlistBuddy -c "Add :teamID string $DEVELOPMENT_TEAM" ci/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/GenbaTokei.xcarchive \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" | tee build-export.log | grep -E '(error|Upload|\*\* )' || true
          grep -q '\*\* EXPORT SUCCEEDED \*\*' build-export.log
      - name: 鍵を消す
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testflight-logs
          path: build-*.log
