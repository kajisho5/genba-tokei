<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'SF Pro Text','Hiragino Sans','Noto Sans CJK JP',sans-serif">
  <style>
    .num{font-family:'SF Pro Display','DejaVu Sans',sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
    .note{fill:#5A6270;font-size:14px}
    .h{fill:#1B1F26;font-size:16px;font-weight:700}
  </style>
  <defs>
    <g id="case">
      <rect x="40" y="-30" width="128" height="40" rx="10" fill="#2A2D33"/>
      <rect x="40" y="238" width="128" height="40" rx="10" fill="#2A2D33"/>
      <rect x="-14" y="-14" width="236" height="276" rx="62" fill="#3A3E45"/>
      <rect x="221" y="62" width="10" height="44" rx="4" fill="#4A4F57"/>
      <rect x="222" y="130" width="7" height="50" rx="3" fill="#4A4F57"/>
      <rect width="208" height="248" rx="50" fill="#000"/>
    </g>
  </defs>
  <rect width="1100" height="640" fill="#E9ECF1"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1B1F26">S4 Apple Watch（46mm想定 208×248pt）</text>
  <text x="40" y="70" class="note">腕を上げている間は1/100秒まで。腕を下ろすと自動で「秒まで・暗め」表示に切り替え（OSの制約：最大1秒ごと更新）。</text>

  <!-- active clock -->
  <g transform="translate(80,150)">
    <use href="#case"/>
    <circle cx="30" cy="30" r="4" fill="#30D158"/>
    <text x="40" y="34" font-size="11" fill="#7FD49A" class="num">±12ms</text>
    <text x="178" y="34" font-size="13" fill="#F5F7FA" text-anchor="end" class="num">11/15</text>
    <text x="104" y="118" text-anchor="middle" class="num" font-size="56" fill="#F5F7FA">12:34</text>
    <text x="104" y="172" text-anchor="middle" class="num"><tspan font-size="40" fill="#F5F7FA">56</tspan><tspan font-size="30" fill="#FFB020">.78</tspan></text>
    <rect x="24" y="196" width="160" height="34" rx="17" fill="#16191E"/>
    <text x="104" y="218" text-anchor="middle" class="num" font-size="13" fill="#8A919C">本番 −25:03</text>
    <text x="104" y="320" text-anchor="middle" class="h">① 時計（腕を上げ中）</text>
    <text x="104" y="342" text-anchor="middle" class="note">2段にして数字を大きく</text>
  </g>

  <!-- always-on -->
  <g transform="translate(340,150)">
    <use href="#case"/>
    <circle cx="30" cy="30" r="4" fill="#1E5A33"/>
    <text x="104" y="118" text-anchor="middle" class="num" font-size="56" fill="#9AA0A8">12:34</text>
    <text x="104" y="172" text-anchor="middle" class="num" font-size="40" fill="#9AA0A8">56</text>
    <text x="104" y="218" text-anchor="middle" class="num" font-size="13" fill="#5A6270">本番 −25:03</text>
    <text x="104" y="320" text-anchor="middle" class="h">② 腕を下ろした時</text>
    <text x="104" y="342" text-anchor="middle" class="note">1/100秒を消し、暗く</text>
  </g>

  <!-- countdown red -->
  <g transform="translate(600,150)">
    <use href="#case"/>
    <text x="104" y="40" text-anchor="middle" font-size="13" fill="#FF453A" font-weight="600">本番（サンプル）まで</text>
    <circle cx="104" cy="130" r="80" fill="none" stroke="#3A1214" stroke-width="9"/>
    <circle cx="104" cy="130" r="80" fill="none" stroke="#FF453A" stroke-width="9" stroke-linecap="round" stroke-dasharray="503" stroke-dashoffset="420" transform="rotate(-90 104 130)"/>
    <text x="104" y="132" text-anchor="middle" class="num" font-size="40" fill="#FF453A">00:48</text>
    <text x="104" y="166" text-anchor="middle" class="num" font-size="26" fill="#FFB020">.22</text>
    <text x="104" y="232" text-anchor="middle" font-size="11" fill="#8A919C">残り1分以下・毎秒コツコツ振動</text>
    <text x="104" y="320" text-anchor="middle" class="h">③ カウントダウン（赤）</text>
    <text x="104" y="342" text-anchor="middle" class="note">0秒で強い振動</text>
  </g>

  <!-- notes -->
  <g transform="translate(860,120)">
    <rect width="210" height="330" rx="18" fill="#F7F8FA" stroke="#D5DAE1"/>
    <text x="18" y="34" class="h">Watchの操作</text>
    <g font-size="13" fill="#333">
      <text x="18" y="66">・デジタルクラウン回転</text>
      <text x="30" y="86">→ 時計/CD/SW 切替</text>
      <text x="18" y="114">・画面タップ</text>
      <text x="30" y="134">→ 開始/停止</text>
      <text x="18" y="162">・時刻補正はiPhoneから</text>
      <text x="30" y="182">受け取る（Watch単体の</text>
      <text x="30" y="202">NTPはOSが不許可）</text>
      <text x="18" y="230">・受け取れない時は</text>
      <text x="30" y="250">緑点→灰色点</text>
      <text x="18" y="278">・文字盤用の小表示</text>
      <text x="30" y="298">（コンプリケーション）</text>
      <text x="30" y="318">はフェーズ2</text>
    </g>
  </g>
  <text x="40" y="600" class="note">Watchの4つ角は丸く欠けるため、上の情報は内側に寄せて配置。数字はすべて等幅（桁が変わっても揺れない）。</text>
</svg>
