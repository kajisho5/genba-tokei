<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="'SF Pro Text','Hiragino Sans','Noto Sans CJK JP',sans-serif">
  <style>
    .num{font-family:'SF Pro Display','DejaVu Sans',sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
    .lbl{fill:#8A919C;font-size:13px}
    .ttl{fill:#F5F7FA}
    .note{fill:#5A6270;font-size:14px}
  </style>
  <rect width="1400" height="1000" fill="#E9ECF1"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1B1F26">S1 iPhone メイン（時計モード）</text>
  <text x="40" y="70" class="note">左：縦向き　右：横向き全画面（ミリ秒を最大表示）　※1/100秒は琥珀色で小さめ</text>

  <!-- ========== Portrait iPhone 393x852 ========== -->
  <g transform="translate(60,110)">
    <rect x="-12" y="-12" width="417" height="876" rx="64" fill="#1A1C20"/>
    <rect width="393" height="852" rx="54" fill="#0B0D10"/>
    <!-- status bar -->
    <text x="52" y="38" font-size="16" font-weight="600" fill="#F5F7FA" class="num">12:34</text>
    <rect x="133" y="14" width="126" height="37" rx="18.5" fill="#000"/>
    <g fill="#F5F7FA"><rect x="300" y="27" width="3" height="8" rx="1"/><rect x="305" y="24" width="3" height="11" rx="1"/><rect x="310" y="21" width="3" height="14" rx="1"/><rect x="315" y="18" width="3" height="17" rx="1"/></g>
    <rect x="328" y="22" width="24" height="12" rx="3.5" fill="none" stroke="#F5F7FA" stroke-opacity=".5"/><rect x="330" y="24" width="18" height="8" rx="2" fill="#F5F7FA"/>

    <!-- top bar -->
    <text x="20" y="96" font-size="17" font-weight="700" class="ttl">現場時計</text>
    <!-- PiP button -->
    <g transform="translate(245,72)">
      <rect width="36" height="36" rx="10" fill="#16191E" stroke="#262A31"/>
      <rect x="8" y="10" width="20" height="16" rx="3" fill="none" stroke="#F5F7FA" stroke-width="1.8"/>
      <rect x="16" y="17" width="10" height="7" rx="1.5" fill="#FFB020"/>
    </g>
    <!-- Island button -->
    <g transform="translate(291,72)">
      <rect width="36" height="36" rx="10" fill="#16191E" stroke="#262A31"/>
      <rect x="7" y="13" width="22" height="10" rx="5" fill="#F5F7FA"/>
      <circle cx="12.5" cy="18" r="2.2" fill="#30D158"/>
    </g>
    <!-- gear -->
    <g transform="translate(337,72)">
      <rect width="36" height="36" rx="10" fill="#16191E" stroke="#262A31"/>
      <circle cx="18" cy="18" r="7.5" fill="none" stroke="#F5F7FA" stroke-width="1.8" stroke-dasharray="3.2 2.3"/>
      <circle cx="18" cy="18" r="3" fill="none" stroke="#F5F7FA" stroke-width="1.8"/>
    </g>

    <!-- sync badge -->
    <g transform="translate(20,128)">
      <rect width="353" height="40" rx="20" fill="#0F2417" stroke="#1E5A33"/>
      <circle cx="22" cy="20" r="5" fill="#30D158"/>
      <text x="36" y="25" font-size="13.5" fill="#B8F0C8">NTP補正済み</text>
      <text x="128" y="25" font-size="13.5" fill="#7FD49A" class="num" font-weight="500">+0.142s  ±12ms ・ 3分前</text>
      <path d="M333 14 a7 7 0 1 1 -5 -2" fill="none" stroke="#7FD49A" stroke-width="1.8"/><path d="M325 9 l4 3 -4 3" fill="none" stroke="#7FD49A" stroke-width="1.8"/>
    </g>

    <!-- date -->
    <text x="196.5" y="262" font-size="17" fill="#8A919C" text-anchor="middle">2026年11月15日（日）JST</text>
    <!-- big clock -->
    <text x="196.5" y="342" text-anchor="middle" class="num"><tspan font-size="62" fill="#F5F7FA">12:34:56</tspan><tspan font-size="40" fill="#FFB020">.78</tspan></text>
    <!-- seconds progress -->
    <rect x="40" y="372" width="313" height="4" rx="2" fill="#262A31"/>
    <rect x="40" y="372" width="296" height="4" rx="2" fill="#F5F7FA" fill-opacity=".85"/>
    <text x="40" y="396" class="lbl">0</text><text x="353" y="396" class="lbl" text-anchor="end">60秒</text>

    <!-- next countdown card -->
    <g transform="translate(20,440)">
      <rect width="353" height="112" rx="18" fill="#16191E" stroke="#262A31"/>
      <text x="18" y="32" font-size="13" fill="#8A919C">次のキュー</text>
      <text x="18" y="56" font-size="18" font-weight="700" fill="#F5F7FA">本番（サンプル）</text>
      <text x="335" y="56" font-size="15" fill="#8A919C" text-anchor="end" class="num">13:00:00</text>
      <text x="18" y="96" class="num"><tspan font-size="30" fill="#F5F7FA">−00:25:03</tspan><tspan font-size="20" fill="#FFB020">.22</tspan></text>
      <rect x="250" y="74" width="85" height="28" rx="14" fill="#262A31"/>
      <text x="292.5" y="93" font-size="13" fill="#F5F7FA" text-anchor="middle">編集</text>
    </g>

    <!-- action buttons -->
    <g transform="translate(20,572)">
      <rect width="170" height="56" rx="16" fill="#FFB020"/>
      <rect x="18" y="18" width="24" height="20" rx="4" fill="none" stroke="#0B0D10" stroke-width="2"/>
      <rect x="28" y="27" width="12" height="9" rx="2" fill="#0B0D10"/>
      <text x="52" y="34" font-size="15" font-weight="700" fill="#0B0D10">小窓で表示</text>
      <rect x="183" width="170" height="56" rx="16" fill="#16191E" stroke="#262A31"/>
      <rect x="199" y="22" width="26" height="12" rx="6" fill="#F5F7FA"/>
      <circle cx="205" cy="28" r="2.5" fill="#30D158"/>
      <text x="233" y="27" font-size="13" font-weight="700" fill="#F5F7FA">Dynamic Island</text>
      <text x="233" y="44" font-size="12" fill="#30D158">表示中</text>
    </g>
    <text x="196.5" y="660" font-size="12" fill="#5A6270" text-anchor="middle">画面スリープ防止：オン</text>

    <!-- tab bar -->
    <path d="M0 752 H393 V798 a54 54 0 0 1 -54 54 H54 a54 54 0 0 1 -54 -54 Z" fill="#0F1114"/>
    <line x1="0" y1="752" x2="393" y2="752" stroke="#262A31"/>
    <g transform="translate(65,772)">
      <circle cx="0" cy="12" r="11" fill="none" stroke="#FFB020" stroke-width="2"/><path d="M0 5 v7 l5 3" stroke="#FFB020" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="0" y="44" font-size="11" fill="#FFB020" text-anchor="middle" font-weight="600">時計</text>
    </g>
    <g transform="translate(196.5,772)">
      <path d="M-9 1 h18 M-9 23 h18 M-7 1 c0 9 14 13 14 22 M7 1 c0 9 -14 13 -14 22" stroke="#8A919C" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="0" y="44" font-size="11" fill="#8A919C" text-anchor="middle">カウントダウン</text>
    </g>
    <g transform="translate(328,772)">
      <circle cx="0" cy="14" r="10" fill="none" stroke="#8A919C" stroke-width="2"/><path d="M-3 1 h6 M0 1 v3 M0 14 l4 -5" stroke="#8A919C" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="0" y="44" font-size="11" fill="#8A919C" text-anchor="middle">ストップウォッチ</text>
    </g>
    <rect x="129" y="836" width="135" height="5" rx="2.5" fill="#F5F7FA" fill-opacity=".6"/>
  </g>

  <!-- ========== Landscape iPhone 852x393 ========== -->
  <g transform="translate(510,300)">
    <rect x="-12" y="-12" width="876" height="417" rx="64" fill="#1A1C20"/>
    <rect width="852" height="393" rx="54" fill="#000"/>
    <rect x="14" y="133" width="37" height="126" rx="18.5" fill="#111"/>
    <!-- sync dot top-right -->
    <circle cx="768" cy="34" r="5" fill="#30D158"/>
    <text x="780" y="39" font-size="13" fill="#7FD49A" class="num">±12ms</text>
    <text x="96" y="38" font-size="15" fill="#5A6270">11/15（日）</text>
    <text x="452" y="228" text-anchor="middle" class="num"><tspan font-size="128" fill="#F5F7FA">12:34:56</tspan><tspan font-size="82" fill="#FFB020">.78</tspan></text>
    <!-- countdown strip -->
    <rect x="96" y="290" width="688" height="56" rx="16" fill="#16191E"/>
    <text x="118" y="325" font-size="16" fill="#8A919C">本番（サンプル）まで</text>
    <text x="762" y="328" text-anchor="end" class="num"><tspan font-size="28" fill="#F5F7FA">−00:25:03</tspan><tspan font-size="19" fill="#FFB020">.22</tspan></text>
  </g>
  <text x="510" y="760" class="note">横向き：余計な部品を消し、数字を最大化。タップで縦画面と同じ操作部を一時表示（3秒で自動で隠れる）。</text>
  <text x="510" y="784" class="note">黒背景は有機ELで電池消費が少ない。上部の緑点＝NTP補正OK（黄＝1時間以上未同期、赤＝未補正）。</text>
</svg>
