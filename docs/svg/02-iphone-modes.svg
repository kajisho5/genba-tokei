<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" font-family="'SF Pro Text','Hiragino Sans','Noto Sans CJK JP',sans-serif">
  <style>
    .num{font-family:'SF Pro Display','DejaVu Sans',sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
    .note{fill:#5A6270;font-size:14px}
  </style>
  <defs>
    <g id="status">
      <rect x="-12" y="-12" width="417" height="876" rx="64" fill="#1A1C20"/>
      <rect width="393" height="852" rx="54" fill="#0B0D10"/>
      <text x="52" y="38" font-size="16" font-weight="600" fill="#F5F7FA" class="num">12:55</text>
      <rect x="133" y="14" width="126" height="37" rx="18.5" fill="#000"/>
      <g fill="#F5F7FA"><rect x="300" y="27" width="3" height="8" rx="1"/><rect x="305" y="24" width="3" height="11" rx="1"/><rect x="310" y="21" width="3" height="14" rx="1"/><rect x="315" y="18" width="3" height="17" rx="1"/></g>
      <rect x="328" y="22" width="24" height="12" rx="3.5" fill="none" stroke="#F5F7FA" stroke-opacity=".5"/><rect x="330" y="24" width="18" height="8" rx="2" fill="#F5F7FA"/>
      <path d="M0 752 H393 V798 a54 54 0 0 1 -54 54 H54 a54 54 0 0 1 -54 -54 Z" fill="#0F1114"/>
      <line x1="0" y1="752" x2="393" y2="752" stroke="#262A31"/>
      <rect x="129" y="836" width="135" height="5" rx="2.5" fill="#F5F7FA" fill-opacity=".6"/>
    </g>
    <g id="tab-clock"><circle cx="0" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="2"/><path d="M0 5 v7 l5 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></g>
    <g id="tab-cd"><path d="M-9 1 h18 M-9 23 h18 M-7 1 c0 9 14 13 14 22 M7 1 c0 9 -14 13 -14 22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></g>
    <g id="tab-sw"><circle cx="0" cy="14" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M-3 1 h6 M0 1 v3 M0 14 l4 -5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></g>
  </defs>
  <rect width="1000" height="1000" fill="#E9ECF1"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1B1F26">S2 カウントダウン ／ ストップウォッチ</text>
  <text x="40" y="70" class="note">残り5分で黄、1分で赤、0で全面フラッシュ＋バイブ。上部の小さな時刻は常に現在時刻（NTP補正済み）。</text>

  <!-- ===== Countdown (warning) ===== -->
  <g transform="translate(60,110)">
    <use href="#status"/>
    <text x="20" y="96" font-size="17" font-weight="700" fill="#F5F7FA">カウントダウン</text>
    <text x="373" y="96" font-size="15" fill="#8A919C" text-anchor="end" class="num">現在 12:55:00.78</text>
    <!-- label + target -->
    <rect x="20" y="124" width="353" height="64" rx="16" fill="#16191E" stroke="#262A31"/>
    <text x="38" y="150" font-size="13" fill="#8A919C">目標</text>
    <text x="38" y="174" font-size="18" font-weight="700" fill="#F5F7FA">本番（サンプル）</text>
    <text x="355" y="168" font-size="20" fill="#F5F7FA" text-anchor="end" class="num">13:00:00.00</text>
    <!-- ring -->
    <circle cx="196.5" cy="365" r="128" fill="none" stroke="#2A2410" stroke-width="12"/>
    <circle cx="196.5" cy="365" r="128" fill="none" stroke="#FFD60A" stroke-width="12" stroke-linecap="round" stroke-dasharray="804" stroke-dashoffset="135" transform="rotate(-90 196.5 365)"/>
    <text x="196.5" y="330" font-size="14" fill="#FFD60A" text-anchor="middle" font-weight="600">残り5分</text>
    <text x="196.5" y="385" text-anchor="middle" class="num"><tspan font-size="54" fill="#FFD60A">04:59</tspan><tspan font-size="34" fill="#FFB020">.22</tspan></text>
    <text x="196.5" y="420" font-size="14" fill="#8A919C" text-anchor="middle" class="num">−00:04:59.22</text>
    <!-- presets -->
    <text x="20" y="540" font-size="13" fill="#8A919C">すぐ設定</text>
    <g font-size="15" fill="#F5F7FA" text-anchor="middle" class="num">
      <rect x="20" y="552" width="80" height="44" rx="12" fill="#16191E" stroke="#262A31"/><text x="60" y="580">+1分</text>
      <rect x="111" y="552" width="80" height="44" rx="12" fill="#16191E" stroke="#262A31"/><text x="151" y="580">+5分</text>
      <rect x="202" y="552" width="80" height="44" rx="12" fill="#16191E" stroke="#262A31"/><text x="242" y="580">+10分</text>
      <rect x="293" y="552" width="80" height="44" rx="12" fill="#16191E" stroke="#262A31"/><text x="333" y="580">時刻…</text>
    </g>
    <rect x="20" y="616" width="170" height="56" rx="16" fill="#16191E" stroke="#262A31"/>
    <text x="105" y="650" font-size="16" font-weight="700" fill="#F5F7FA" text-anchor="middle">リセット</text>
    <rect x="203" y="616" width="170" height="56" rx="16" fill="#FFB020"/>
    <text x="288" y="650" font-size="16" font-weight="700" fill="#0B0D10" text-anchor="middle">Islandに表示</text>
    <g transform="translate(65,772)" color="#8A919C"><use href="#tab-clock"/><text x="0" y="44" font-size="11" fill="#8A919C" text-anchor="middle">時計</text></g>
    <g transform="translate(196.5,772)" color="#FFB020"><use href="#tab-cd"/><text x="0" y="44" font-size="11" fill="#FFB020" text-anchor="middle" font-weight="600">カウントダウン</text></g>
    <g transform="translate(328,772)" color="#8A919C"><use href="#tab-sw"/><text x="0" y="44" font-size="11" fill="#8A919C" text-anchor="middle">ストップウォッチ</text></g>
  </g>

  <!-- ===== Stopwatch ===== -->
  <g transform="translate(540,110)">
    <use href="#status"/>
    <text x="20" y="96" font-size="17" font-weight="700" fill="#F5F7FA">ストップウォッチ</text>
    <text x="373" y="96" font-size="15" fill="#8A919C" text-anchor="end" class="num">現在 12:55:00.78</text>
    <text x="196.5" y="250" text-anchor="middle" class="num"><tspan font-size="64" fill="#F5F7FA">03:27</tspan><tspan font-size="42" fill="#FFB020">.41</tspan></text>
    <text x="196.5" y="285" font-size="14" fill="#8A919C" text-anchor="middle" class="num">開始 12:51:33.37</text>
    <!-- buttons -->
    <circle cx="96" cy="370" r="44" fill="#16191E" stroke="#262A31"/>
    <text x="96" y="376" font-size="16" font-weight="700" fill="#F5F7FA" text-anchor="middle">ラップ</text>
    <circle cx="297" cy="370" r="44" fill="#3A1214" stroke="#FF453A"/>
    <text x="297" y="376" font-size="16" font-weight="700" fill="#FF453A" text-anchor="middle">停止</text>
    <!-- laps -->
    <line x1="20" y1="450" x2="373" y2="450" stroke="#262A31"/>
    <g font-size="16" class="num">
      <text x="20" y="484" fill="#8A919C">ラップ 3</text><text x="373" y="484" fill="#F5F7FA" text-anchor="end">00:41.18</text>
      <line x1="20" y1="500" x2="373" y2="500" stroke="#262A31"/>
      <text x="20" y="534" fill="#8A919C">ラップ 2</text><text x="373" y="534" fill="#30D158" text-anchor="end">01:02.09</text>
      <line x1="20" y1="550" x2="373" y2="550" stroke="#262A31"/>
      <text x="20" y="584" fill="#8A919C">ラップ 1</text><text x="373" y="584" fill="#FF453A" text-anchor="end">01:44.14</text>
      <line x1="20" y1="600" x2="373" y2="600" stroke="#262A31"/>
    </g>
    <text x="20" y="632" font-size="12" fill="#5A6270">緑＝最速　赤＝最遅　長押しでコピー</text>
    <g transform="translate(65,772)" color="#8A919C"><use href="#tab-clock"/><text x="0" y="44" font-size="11" fill="#8A919C" text-anchor="middle">時計</text></g>
    <g transform="translate(196.5,772)" color="#8A919C"><use href="#tab-cd"/><text x="0" y="44" font-size="11" fill="#8A919C" text-anchor="middle">カウントダウン</text></g>
    <g transform="translate(328,772)" color="#FFB020"><use href="#tab-sw"/><text x="0" y="44" font-size="11" fill="#FFB020" text-anchor="middle" font-weight="600">ストップウォッチ</text></g>
  </g>
</svg>
