<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2760" viewBox="0 0 2000 2760" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif">
  <style>
    .num{font-family:'SF Pro Display','DejaVu Sans',sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
    .t{fill:#F5F7FA}.s{fill:#8A919C}.a{fill:#FFB020}
    .note{fill:#5A6270;font-size:15px}
  </style>
  <defs>
    <g id="dot"><circle r="5" fill="#30D158"/></g>
  </defs>
  <rect width="2000" height="2760" fill="#E9ECF1"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1B1F26">紹介ページ（LP）デザイン ― 左：パソコン幅 1440px　右：スマホ幅 390px</text>
  <text x="40" y="72" class="note">全体を黒基調（アプリと同じ配色）。島の部分は islandcn で本物そっくりに動く。数字はブラウザの時刻で実際に進む。</text>

  <!-- ================= DESKTOP ================= -->
  <g transform="translate(40,100)">
    <rect width="1440" height="2620" fill="#0B0D10"/>
    <!-- nav -->
    <rect width="1440" height="68" fill="#0B0D10"/>
    <line x1="0" y1="68" x2="1440" y2="68" stroke="#1C2026"/>
    <circle cx="96" cy="34" r="6" fill="#FFB020"/>
    <text x="112" y="41" font-size="19" font-weight="700" class="t">現場時計</text>
    <g font-size="15" class="s"><text x="900" y="40">特長</text><text x="968" y="40">デモ</text><text x="1036" y="40">開発状況</text><text x="1132" y="40">GitHub</text></g>
    <rect x="1220" y="16" width="140" height="36" rx="18" fill="none" stroke="#FFB020"/>
    <text x="1290" y="39" font-size="14" text-anchor="middle" class="a" font-weight="600">TestFlight（準備中）</text>

    <!-- hero -->
    <text x="96" y="200" font-size="16" class="a" font-weight="600">iPhone ・ iPad ・ Apple Watch 用の現場時計</text>
    <text x="96" y="280" font-size="58" font-weight="800" class="t">1/100秒まで、</text>
    <text x="96" y="356" font-size="58" font-weight="800" class="t">現場の全員が同じ時刻。</text>
    <text x="96" y="418" font-size="19" class="s">ネットの正確な時刻に合わせて、端末のずれを自動で補正。</text>
    <text x="96" y="448" font-size="19" class="s">Dynamic Island にも、他のアプリの上の小窓にも出せます。</text>
    <rect x="96" y="492" width="220" height="56" rx="16" fill="#FFB020"/>
    <text x="206" y="527" font-size="17" text-anchor="middle" font-weight="700" fill="#0B0D10">デモを試す ↓</text>
    <rect x="332" y="492" width="200" height="56" rx="16" fill="#16191E" stroke="#262A31"/>
    <text x="432" y="527" font-size="17" text-anchor="middle" font-weight="600" class="t">GitHub を見る</text>
    <!-- live clock line -->
    <g transform="translate(96,600)">
      <use href="#dot" x="6" y="-6"/>
      <text x="20" y="0" font-size="14" class="s">このページの時計（お使いの端末の時刻）</text>
      <text x="0" y="62" class="num"><tspan font-size="56" class="t">12:34:56</tspan><tspan font-size="36" class="a">.78</tspan></text>
    </g>
    <!-- phone mockup -->
    <g transform="translate(900,120)">
      <rect x="-14" y="-14" width="390" height="760" rx="68" fill="#1F2329"/>
      <rect width="362" height="732" rx="56" fill="#000"/>
      <!-- island compact (islandcn) -->
      <rect x="66" y="14" width="230" height="36" rx="18" fill="#000" stroke="#1A1A1A"/>
      <circle cx="86" cy="32" r="5" fill="#30D158"/>
      <text x="282" y="38" text-anchor="end" class="num"><tspan font-size="14" class="t">12:34:56</tspan><tspan font-size="10.5" class="a">.78</tspan></text>
      <!-- clock-only stacked -->
      <text x="181" y="300" text-anchor="middle" class="num t" font-size="140">12</text>
      <text x="181" y="450" text-anchor="middle" class="num t" font-size="140">34</text>
      <text x="181" y="560" text-anchor="middle" class="num"><tspan font-size="90" class="t">56</tspan><tspan font-size="58" class="a">.78</tspan></text>
      <circle cx="334" cy="34" r="4" fill="#30D158" fill-opacity=".7"/>
    </g>
    <text x="900" y="890" class="note" fill="#5A6270">↑ 島（上の黒い枠）は islandcn で再現。スクロールで島が「展開」する演出</text>

    <!-- demo section -->
    <rect x="0" y="940" width="1440" height="560" fill="#101215"/>
    <text x="720" y="1010" font-size="34" font-weight="800" text-anchor="middle" class="t">Dynamic Island の動きを試す</text>
    <text x="720" y="1046" font-size="16" text-anchor="middle" class="s">ボタンを押すと島の表示が切り替わります。島を長押しすると展開します。</text>
    <!-- stage -->
    <rect x="370" y="1080" width="700" height="260" rx="28" fill="#1B1E23"/>
    <rect x="533" y="1100" width="374" height="110" rx="46" fill="#000"/>
    <circle cx="566" cy="1132" r="5" fill="#30D158"/>
    <text x="578" y="1137" font-size="12" fill="#7FD49A" class="num">NTP ±12ms</text>
    <text x="880" y="1137" font-size="12" class="s" text-anchor="end">本番まで −25:03</text>
    <text x="720" y="1186" text-anchor="middle" class="num"><tspan font-size="44" class="t">12:34:56</tspan><tspan font-size="29" class="a">.78</tspan></text>
    <text x="720" y="1300" font-size="13" class="s" text-anchor="middle">（展開表示の例）</text>
    <!-- segmented -->
    <g transform="translate(400,1370)" font-size="15" text-anchor="middle">
      <rect width="640" height="52" rx="16" fill="#16191E" stroke="#262A31"/>
      <rect x="4" y="4" width="156" height="44" rx="12" fill="#2A2F37"/>
      <text x="82" y="32" class="t" font-weight="600">時計</text>
      <text x="240" y="32" class="s">カウントダウン</text>
      <text x="400" y="32" class="s">展開</text>
      <text x="560" y="32" class="s">2つ同時</text>
    </g>
    <text x="720" y="1462" font-size="13" text-anchor="middle" fill="#5A6270">※ ブラウザ上の再現です。実機の Dynamic Island の表示は Apple の仕様に従います。</text>

    <!-- features -->
    <text x="96" y="1590" font-size="34" font-weight="800" class="t">特長</text>
    <g font-size="15">
      <!-- card template x3 x2 -->
      <g transform="translate(96,1620)">
        <rect width="400" height="200" rx="20" fill="#16191E" stroke="#262A31"/>
        <circle cx="44" cy="48" r="20" fill="#0F2417"/><circle cx="44" cy="48" r="6" fill="#30D158"/>
        <text x="28" y="106" font-size="20" font-weight="700" class="t">時刻を自動で補正</text>
        <text x="28" y="140" class="s">ネットの時刻サーバーに問い合わせて、</text>
        <text x="28" y="164" class="s">端末のずれと誤差（±ms）を表示。</text>
      </g>
      <g transform="translate(520,1620)">
        <rect width="400" height="200" rx="20" fill="#16191E" stroke="#262A31"/>
        <rect x="24" y="36" width="40" height="24" rx="12" fill="#F5F7FA"/><circle cx="34" cy="48" r="3.5" fill="#30D158"/>
        <text x="28" y="106" font-size="20" font-weight="700" class="t">Dynamic Island</text>
        <text x="28" y="140" class="s">ホーム画面でも上の島に時刻。</text>
        <text x="28" y="164" class="s">1/100秒表示は実機で検証中。</text>
      </g>
      <g transform="translate(944,1620)">
        <rect width="400" height="200" rx="20" fill="#16191E" stroke="#262A31"/>
        <rect x="24" y="34" width="40" height="30" rx="5" fill="none" stroke="#F5F7FA" stroke-width="2.5"/><rect x="40" y="46" width="20" height="14" rx="2" fill="#FFB020"/>
        <text x="28" y="106" font-size="20" font-weight="700" class="t">小窓で表示</text>
        <text x="28" y="140" class="s">台本や進行表を見ながら、</text>
        <text x="28" y="164" class="s">時計を画面の上に浮かべる。</text>
      </g>
      <g transform="translate(96,1844)">
        <rect width="400" height="200" rx="20" fill="#16191E" stroke="#262A31"/>
        <text x="26" y="64" class="num" font-size="30"><tspan class="t">56</tspan><tspan class="a" font-size="20">.78</tspan></text>
        <text x="28" y="106" font-size="20" font-weight="700" class="t">時計だけモード</text>
        <text x="28" y="140" class="s">ボタンも文字も消して、時刻だけを</text>
        <text x="28" y="164" class="s">画面いっぱいに。誤操作も防止。</text>
      </g>
      <g transform="translate(520,1844)">
        <rect width="400" height="200" rx="20" fill="#16191E" stroke="#262A31"/>
        <circle cx="44" cy="48" r="18" fill="none" stroke="#FFD60A" stroke-width="5" stroke-dasharray="80 113"/>
        <text x="28" y="106" font-size="20" font-weight="700" class="t">本番までカウントダウン</text>
        <text x="28" y="140" class="s">残り5分で黄、1分で赤。</text>
        <text x="28" y="164" class="s">0秒で振動してお知らせ。</text>
      </g>
      <g transform="translate(944,1844)">
        <rect width="400" height="200" rx="20" fill="#16191E" stroke="#262A31"/>
        <rect x="26" y="28" width="36" height="42" rx="12" fill="none" stroke="#F5F7FA" stroke-width="2.5"/>
        <text x="28" y="106" font-size="20" font-weight="700" class="t">Apple Watch</text>
        <text x="28" y="140" class="s">手首でも同じ時刻。iPhoneで測った</text>
        <text x="28" y="164" class="s">ずれを受け取って補正。</text>
      </g>
    </g>

    <!-- operators -->
    <rect x="0" y="2100" width="1440" height="300" fill="#101215"/>
    <text x="96" y="2170" font-size="30" font-weight="800" class="t">オペレーターのために</text>
    <g font-size="17" class="s">
      <text x="96" y="2220">● 舞台袖：横置きで、離れた所からも読める大きな数字</text>
      <text x="96" y="2256">● 配信・収録卓：小窓で進行表と並べて確認</text>
      <text x="96" y="2292">● 撮影現場：全員の端末の時刻を±数十ミリ秒にそろえる</text>
    </g>
    <g transform="translate(860,2140)">
      <rect x="-10" y="-10" width="500" height="236" rx="44" fill="#1F2329"/>
      <rect width="480" height="216" rx="36" fill="#000"/>
      <text x="240" y="132" text-anchor="middle" class="num"><tspan font-size="76" class="t">12:34:56</tspan><tspan font-size="48" class="a">.78</tspan></text>
    </g>

    <!-- status -->
    <text x="96" y="2470" font-size="26" font-weight="800" class="t">開発状況</text>
    <g font-size="15">
      <circle cx="106" cy="2512" r="8" fill="#30D158"/><text x="124" y="2517" class="t">設計・デザイン</text>
      <line x1="230" y1="2512" x2="300" y2="2512" stroke="#262A31" stroke-width="2"/>
      <circle cx="312" cy="2512" r="8" fill="#FFB020"/><text x="330" y="2517" class="a" font-weight="600">試作（いまここ）</text>
      <line x1="470" y1="2512" x2="540" y2="2512" stroke="#262A31" stroke-width="2"/>
      <circle cx="552" cy="2512" r="8" fill="none" stroke="#5A6270" stroke-width="2"/><text x="570" y="2517" class="s">TestFlight 公開</text>
      <line x1="700" y1="2512" x2="770" y2="2512" stroke="#262A31" stroke-width="2"/>
      <circle cx="782" cy="2512" r="8" fill="none" stroke="#5A6270" stroke-width="2"/><text x="800" y="2517" class="s">App Store</text>
    </g>
    <line x1="96" y1="2560" x2="1344" y2="2560" stroke="#1C2026"/>
    <text x="96" y="2596" font-size="13" fill="#5A6270">島の再現に islandcn（MIT ライセンス）を使用。Apple、iPhone、Dynamic Island は Apple Inc. の商標です。本ページは Apple と無関係です。</text>
  </g>

  <!-- ================= MOBILE ================= -->
  <g transform="translate(1560,100)">
    <rect width="390" height="2620" fill="#0B0D10"/>
    <rect width="390" height="56" fill="#0B0D10"/>
    <line x1="0" y1="56" x2="390" y2="56" stroke="#1C2026"/>
    <circle cx="26" cy="28" r="5" fill="#FFB020"/>
    <text x="38" y="34" font-size="16" font-weight="700" class="t">現場時計</text>
    <g transform="translate(346,18)" fill="#F5F7FA"><rect width="22" height="2.5" rx="1"/><rect y="8" width="22" height="2.5" rx="1"/><rect y="16" width="22" height="2.5" rx="1"/></g>
    <!-- island pinned to viewport top (on desktop it's inside phone) -->
    <text x="16" y="116" font-size="13" class="a" font-weight="600">iPhone ・ iPad ・ Apple Watch 用</text>
    <text x="16" y="164" font-size="32" font-weight="800" class="t">1/100秒まで、</text>
    <text x="16" y="208" font-size="32" font-weight="800" class="t">現場の全員が</text>
    <text x="16" y="252" font-size="32" font-weight="800" class="t">同じ時刻。</text>
    <text x="16" y="292" font-size="15" class="s">ネットの正確な時刻に合わせて、</text>
    <text x="16" y="316" font-size="15" class="s">端末のずれを自動で補正。</text>
    <rect x="16" y="344" width="358" height="52" rx="16" fill="#FFB020"/>
    <text x="195" y="377" font-size="16" text-anchor="middle" font-weight="700" fill="#0B0D10">デモを試す ↓</text>
    <rect x="16" y="406" width="358" height="52" rx="16" fill="#16191E" stroke="#262A31"/>
    <text x="195" y="439" font-size="16" text-anchor="middle" font-weight="600" class="t">GitHub を見る</text>
    <!-- phone -->
    <g transform="translate(70,500) scale(0.69)">
      <rect x="-14" y="-14" width="390" height="760" rx="68" fill="#1F2329"/>
      <rect width="362" height="732" rx="56" fill="#000"/>
      <rect x="66" y="14" width="230" height="36" rx="18" fill="#000" stroke="#1A1A1A"/>
      <circle cx="86" cy="32" r="5" fill="#30D158"/>
      <text x="282" y="38" text-anchor="end" class="num"><tspan font-size="14" class="t">12:34:56</tspan><tspan font-size="10.5" class="a">.78</tspan></text>
      <text x="181" y="300" text-anchor="middle" class="num t" font-size="140">12</text>
      <text x="181" y="450" text-anchor="middle" class="num t" font-size="140">34</text>
      <text x="181" y="560" text-anchor="middle" class="num"><tspan font-size="90" class="t">56</tspan><tspan font-size="58" class="a">.78</tspan></text>
    </g>
    <!-- demo -->
    <rect y="1050" width="390" height="460" fill="#101215"/>
    <text x="195" y="1104" font-size="22" font-weight="800" text-anchor="middle" class="t">Dynamic Island を試す</text>
    <rect x="16" y="1130" width="358" height="200" rx="24" fill="#1B1E23"/>
    <rect x="24" y="1142" width="342" height="104" rx="42" fill="#000"/>
    <circle cx="52" cy="1170" r="4.5" fill="#30D158"/>
    <text x="62" y="1174" font-size="11" fill="#7FD49A" class="num">±12ms</text>
    <text x="195" y="1222" text-anchor="middle" class="num"><tspan font-size="38" class="t">12:34:56</tspan><tspan font-size="25" class="a">.78</tspan></text>
    <g transform="translate(16,1350)" font-size="14" text-anchor="middle">
      <rect width="174" height="48" rx="14" fill="#2A2F37"/><text x="87" y="30" class="t" font-weight="600">時計</text>
      <rect x="184" width="174" height="48" rx="14" fill="#16191E" stroke="#262A31"/><text x="271" y="30" class="s">カウントダウン</text>
      <rect y="58" width="174" height="48" rx="14" fill="#16191E" stroke="#262A31"/><text x="87" y="88" class="s">展開</text>
      <rect x="184" y="58" width="174" height="48" rx="14" fill="#16191E" stroke="#262A31"/><text x="271" y="88" class="s">2つ同時</text>
    </g>
    <text x="195" y="1490" font-size="11" text-anchor="middle" fill="#5A6270">※ ブラウザ上の再現です</text>
    <!-- features stacked -->
    <text x="16" y="1570" font-size="24" font-weight="800" class="t">特長</text>
    <g font-size="14">
      <g transform="translate(16,1592)"><rect width="358" height="112" rx="18" fill="#16191E" stroke="#262A31"/><circle cx="34" cy="36" r="6" fill="#30D158"/><text x="54" y="42" font-size="17" font-weight="700" class="t">時刻を自動で補正</text><text x="20" y="74" class="s">ネットの時刻サーバーに問い合わせて、</text><text x="20" y="96" class="s">ずれと誤差（±ms）を表示。</text></g>
      <g transform="translate(16,1716)"><rect width="358" height="112" rx="18" fill="#16191E" stroke="#262A31"/><rect x="20" y="28" width="30" height="16" rx="8" fill="#F5F7FA"/><text x="62" y="42" font-size="17" font-weight="700" class="t">Dynamic Island</text><text x="20" y="74" class="s">ホーム画面でも上の島に時刻。</text><text x="20" y="96" class="s">1/100秒表示は実機で検証中。</text></g>
      <g transform="translate(16,1840)"><rect width="358" height="112" rx="18" fill="#16191E" stroke="#262A31"/><rect x="20" y="26" width="30" height="22" rx="4" fill="none" stroke="#F5F7FA" stroke-width="2"/><text x="62" y="42" font-size="17" font-weight="700" class="t">小窓で表示</text><text x="20" y="74" class="s">台本や進行表を見ながら、</text><text x="20" y="96" class="s">時計を画面の上に浮かべる。</text></g>
      <g transform="translate(16,1964)"><rect width="358" height="112" rx="18" fill="#16191E" stroke="#262A31"/><text x="20" y="44" class="num" font-size="20"><tspan class="t">56</tspan><tspan class="a" font-size="14">.78</tspan></text><text x="82" y="42" font-size="17" font-weight="700" class="t">時計だけモード</text><text x="20" y="74" class="s">ボタンも文字も消して、</text><text x="20" y="96" class="s">時刻だけを画面いっぱいに。</text></g>
      <text x="16" y="2112" class="s" font-size="13">… 残り2枚（カウントダウン・Apple Watch）も同じ形で縦に並ぶ</text>
    </g>
    <!-- status -->
    <text x="16" y="2190" font-size="22" font-weight="800" class="t">開発状況</text>
    <g font-size="15">
      <circle cx="26" cy="2228" r="7" fill="#30D158"/><text x="44" y="2233" class="t">設計・デザイン</text>
      <circle cx="26" cy="2264" r="7" fill="#FFB020"/><text x="44" y="2269" class="a" font-weight="600">試作（いまここ）</text>
      <circle cx="26" cy="2300" r="7" fill="none" stroke="#5A6270" stroke-width="2"/><text x="44" y="2305" class="s">TestFlight 公開</text>
      <circle cx="26" cy="2336" r="7" fill="none" stroke="#5A6270" stroke-width="2"/><text x="44" y="2341" class="s">App Store</text>
      <line x1="26" y1="2235" x2="26" y2="2257" stroke="#262A31" stroke-width="2"/><line x1="26" y1="2271" x2="26" y2="2293" stroke="#262A31" stroke-width="2"/><line x1="26" y1="2307" x2="26" y2="2329" stroke="#262A31" stroke-width="2"/>
    </g>
    <line x1="16" y1="2390" x2="374" y2="2390" stroke="#1C2026"/>
    <text x="16" y="2420" font-size="11" fill="#5A6270">島の再現に islandcn（MIT）を使用。</text>
    <text x="16" y="2438" font-size="11" fill="#5A6270">Apple、iPhone、Dynamic Island は Apple Inc. の商標。</text>
    <text x="16" y="2456" font-size="11" fill="#5A6270">本ページは Apple と無関係です。</text>
  </g>
</svg>
