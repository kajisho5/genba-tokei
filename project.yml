# XcodeGen 設定。CI 上で `xcodegen generate` して GenbaTokei.xcodeproj を作る。
# 署名・配布は kajisho5/runway の共通ワークフロー（チーム ID は xcodebuild に渡される）。
name: GenbaTokei
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  GenbaTokei:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.GenbaTokei
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 現場時計
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: GenbaLiveActivity
        embed: true
  GenbaLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.GenbaTokei.LiveActivity
        SKIP_INSTALL: true
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: 現場時計
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  GenbaTokeiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared/Time
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.GenbaTokei.Tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  GenbaTokei:
    build:
      targets:
        GenbaTokei: all
    test:
      targets:
        - GenbaTokeiTests
