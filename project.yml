# XcodeGen 設定。CI 上で `xcodegen generate` して GenbaTokei.xcodeproj を作る。
# 環境変数（GitHub Actions から渡す）：
#   BUNDLE_ID_PREFIX … 例 "com.example"（自分のドメインを逆にしたもの）
#   DEVELOPMENT_TEAM … Apple Developer のチーム ID（署名する時だけ必要）
name: GenbaTokei
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  GenbaTokei:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.genbatokei
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 現場時計
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: GenbaLiveActivity
        embed: true
  GenbaLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.genbatokei.liveactivity
        SKIP_INSTALL: true
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: 現場時計
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  GenbaTokeiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared/Time
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.genbatokei.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  GenbaTokei:
    build:
      targets:
        GenbaTokei: all
    test:
      targets:
        - GenbaTokeiTests
